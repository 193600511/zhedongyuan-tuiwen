                  近日，温州市教育局发布了《关于公布温州市第二批市级“高等职业院校教师教学创新团队”终期验收结果的通知》（温教高〔2025〕69号），浙江东方职业技术学院智慧健康养老服务与管理中高职一体化、大数据技术、大数据与会计、包装策划与设计等4支教师教学创新团队，习近平新时代中国特色社会主义思想概论教学创新团队均顺利通过验收。
