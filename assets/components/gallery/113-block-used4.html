
          <span style="font-size: 15px;">
           “急救知识的普及已经成为中央关心、社会关注、人民关切的重大时代性、社会性问题。”杨大研表示，教育部于2021年启动并深入推进全国学校急救教育试点工作，先后遴选两批共1200所学校开展急救教育试点，覆盖各级各类学校，稳步推进学校急救教育普及。试点开展三年来，各地将急救教育融入学校育人全局，创新育人方式方法、激发实践育人效能、凝聚急救育人合力，取得了显著成效。就进一步深入推进学校急救教育工作，他提出，要探索构建全学段、一体化急救教育育人体系，提升师资专业素养，深化课程资源开发，强化师生施救能力，带动社会广泛参与。希望各地各校探索机制、积累经验、塑造模板，推动急救教育事业再上新台阶。
