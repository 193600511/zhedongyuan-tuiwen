                 <span leaf="">
                  11月11日，浙江东方职业技术学院行政楼二楼报告厅内掌声不断，气氛热烈——“党的创新理论青年说”温州市巡回宣讲活动在此成功举办。活动由温州市委宣传部、市教育局联合主办，市新闻传媒中心、浙江东方职业技术学院承办。五位来自不同领域的宣讲员轮番登台，以青春的视角、鲜活的语言、真挚的情感，讲述新时代的奋斗故事，阐释党的创新理论的深刻内涵，为现场师生带来了一场有温度、有深度、有力量的思想盛宴。
                 </span>
